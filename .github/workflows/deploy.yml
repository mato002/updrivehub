name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Code to Production
    runs-on: ubuntu-latest
    steps:
    - name: Get Latest Code
      uses: actions/checkout@v4

    - name: Sync Production Files to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./
        log-level: minimal
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/.github/**
          **/tests/**
          **/storage/logs/**
          **/storage/framework/cache/**
          **/storage/framework/sessions/**
          **/storage/framework/views/**
          **/.env
          **/.env.*
          **/vendor.zip
          phpunit.xml
          phpunit.xml.dist
          .editorconfig
          .gitattributes
          .gitignore

    - name: Run Production Migrations
      if: success()
      run: |
        curl -sf -X POST \
          -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
          "${{ secrets.DEPLOY_URL }}/deploy/migrate"
