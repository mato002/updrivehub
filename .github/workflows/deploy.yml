name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Code to Production
    runs-on: ubuntu-latest
    steps:
    - name: Get Latest Code
      uses: actions/checkout@v4

    - name: Sync Production Files to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./
        log-level: minimal
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/.github/**
          **/tests/**
          **/storage/logs/**
          **/storage/framework/cache/**
          **/storage/framework/sessions/**
          **/storage/framework/views/**
          **/.env
          **/.env.*
          **/vendor.zip
          phpunit.xml
          phpunit.xml.dist
          .editorconfig
          .gitattributes
          .gitignore

    - name: Run Production Migrations
      if: success()
      env:
        DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
      run: |
        if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_SECRET" ]; then
          echo "Skipping migrations: add DEPLOY_URL and DEPLOY_SECRET in GitHub repository secrets."
          exit 0
        fi

        DEPLOY_URL="${DEPLOY_URL%/}"
        HTTP_CODE=$(curl -sS -o /tmp/migrate-response.txt -w "%{http_code}" -X POST \
          -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
          "${DEPLOY_URL}/deploy/migrate")

        cat /tmp/migrate-response.txt
        echo ""
        echo "HTTP status: ${HTTP_CODE}"

        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          exit 0
        fi

        echo "Migration request failed. Check DEPLOY_URL, DEPLOY_SECRET, and production .env."
        exit 1
