services:
  - type: web
    name: driver-recruitment
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: driver-recruitment-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Driver Recruitment
      - key: RECRUITMENT_COMPANY_NAME
        sync: false
      - key: RECRUITMENT_HR_EMAIL
        sync: false
      - key: RECRUITMENT_PHONE
        sync: false
      - key: RECRUITMENT_EMAIL
        sync: false
      - key: RECRUITMENT_ADDRESS
        sync: false

databases:
  - name: driver-recruitment-db
    plan: free
    databaseName: driver_recruitment
    user: driver_app
